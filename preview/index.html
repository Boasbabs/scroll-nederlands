<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaalNudge preview · side panel</title>
    <style>
      body { margin: 0; background: #d9dce1; }
      #root { width: 380px; height: 100vh; margin: 0 auto; overflow-y: auto; background: #fff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';
      import { App } from '../src/ui/panel/App';
      import { EnvProvider } from '../src/ui/env';
      import { createPreviewEnv } from './preview-env';
      import '../src/ui/styles.css';
      createRoot(document.getElementById('root')).render(createElement(EnvProvider, { env: createPreviewEnv() }, createElement(App)));
    </script>
  </body>
</html>
